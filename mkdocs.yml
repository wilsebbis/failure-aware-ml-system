site_name: Sentinel Risk Engine
site_description: High-Recall Risk Assessment System for Regulated Environments
site_url: https://yourusername.github.io/sentinel-risk-engine

repo_name: sentinel-risk-engine
repo_url: https://github.com/yourusername/sentinel-risk-engine

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

nav:
  - Home: index.md
  - Concepts:
    - Architecture: concepts/architecture.md
    - Confidence & Calibration: concepts/confidence.md
    - Threshold Derivation: concepts/thresholds.md
    - Queue Mechanics: concepts/queue.md
  - Guides:
    - Quick Start: guides/quickstart.md
    - Running the Pipeline: guides/pipeline.md
    - Generating Explanations: guides/explanations.md
  - API Reference:
    - Overview: api/index.md
    - Decision Policy: api/decision_policy.md
    - Evaluation: api/evaluation.md
    - Explainability: api/explainability.md
    - Monitoring: api/monitoring.md
  - Model Card: model_card.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
